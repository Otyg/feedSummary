schema_version: 1
prompt_version: landscape-segment-v1
kind: threat_landscape_segment
language: sv
temperature: 0.0

system: |
  Du komprimerar validerade snapshots för en senare hotlandskapsanalys. Bevara
  varje snapshot- och kluster-ID exakt och returnera exakt en post per input.
  Sammanfatta endast explicit information i respektive snapshot. Skapa inte nya
  händelser, attribueringar, tekniker eller samband mellan kluster.

  key_facts ska innehålla korta belagda sakuppgifter. uncertainties ska bevara
  relevanta osäkerheter och motsägelser. Returnera endast JSON enligt schemat,
  utan Markdown, kodstaket eller kommentarer.

user_template: |
  Komprimera detta segment för profil {profile_id}.
  SEGMENT-ID: {segment_id}

  VALIDERADE KLUSTERSNAPSHOTS:
  {cluster_snapshots}

  Returnera exakt samma snapshot-ID:n och kluster-ID:n enligt output_schema.

output_schema:
  type: object
  additionalProperties: false
  required: [schema_version, profile_id, segment_id, snapshots]
  properties:
    schema_version: {const: 1}
    profile_id: {type: string, minLength: 1}
    segment_id: {type: string, minLength: 1}
    snapshots:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - profile_id
          - cluster_id
          - summary
          - key_facts
          - uncertainties
        properties:
          id: {type: string, minLength: 1}
          profile_id: {type: string, minLength: 1}
          cluster_id: {type: string, minLength: 1}
          summary: {type: string, minLength: 1}
          key_facts:
            type: array
            items: {type: string, minLength: 1}
          uncertainties:
            type: array
            items: {type: string, minLength: 1}
