schema_version: 1
prompt_version: cluster-update-v2
kind: threat_cluster_snapshot
language: sv
temperature: 0.0

system: |
  Du uppdaterar ett kort, strukturerat tillstånd för ett
  cyberhändelsekluster. Använd endast föregående snapshot och de nya artiklar
  som bifogas. Varje nytt eller ändrat sakpåstående måste ha
  evidence_article_ids från den tillåtna listan.

  Skilj publiceringstid från uttrycklig händelsetid. Bevara motstridiga
  uppgifter genom status disputed och ersatta uppgifter genom status
  superseded; skriv aldrig tyst om historiken. Ange MITRE ATT&CK-ID endast när
  en artikel uttryckligen stödjer tekniken. Skapa inte attribuering, aktörer,
  sårbarheter, datum eller teknik-ID:n genom antagande.

  Var koncis. Prioritera högst åtta centrala fakta och åtta tidslinjeposter.
  Slå samman överlappande belägg i samma post. Om underlaget inte räcker ska
  insufficient_evidence vara true och osäkerheten beskrivas. Returnera endast
  ett JSON-objekt enligt output_schema, utan Markdown, kodstaket eller
  kommentarer.

user_template: |
  Uppdatera klustersnapshoten till membership_revision {membership_revision}.

  PROFIL-ID: {profile_id}
  KLUSTER-ID: {cluster_id}

  TILLÅTNA ARTIKEL-ID:N:
  {allowed_article_ids}

  FÖREGÅENDE SNAPSHOT, ELLER NULL:
  {previous_snapshot}

  NYA ARTIKLAR:
  {new_articles}

  Behåll fortsatt giltiga fakta från föregående snapshot. Lägg till, bestrid
  eller ersätt fakta endast när de nya artiklarna stöder förändringen. Skriv
  kort och returnera endast JSON enligt output_schema.

output_schema:
  type: object
  additionalProperties: false
  required:
    - schema_version
    - profile_id
    - cluster_id
    - membership_revision
    - title
    - summary
    - confidence
    - insufficient_evidence
    - facts
    - timeline
    - mitre_techniques
    - uncertainties
  properties:
    schema_version: {const: 1}
    profile_id: {type: string, minLength: 1}
    cluster_id: {type: string, minLength: 1}
    membership_revision: {type: integer, minimum: 1}
    title: {type: string, minLength: 1, maxLength: 160}
    summary: {type: string, minLength: 1, maxLength: 1200}
    confidence: {enum: [low, medium, high]}
    insufficient_evidence: {type: boolean}
    facts:
      type: array
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        required: [statement, status, evidence_article_ids]
        properties:
          statement: {type: string, minLength: 1, maxLength: 500}
          status: {enum: [active, disputed, superseded]}
          evidence_article_ids: {$ref: "#/$defs/evidence_ids"}
    timeline:
      type: array
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        required: [statement, evidence_article_ids]
        properties:
          event_time: {type: string, minLength: 1}
          statement: {type: string, minLength: 1, maxLength: 400}
          evidence_article_ids: {$ref: "#/$defs/evidence_ids"}
    mitre_techniques:
      type: array
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        required: [technique_id, statement, evidence_article_ids]
        properties:
          technique_id:
            type: string
            pattern: "^T[0-9]{4}(\\.[0-9]{3})?$"
          statement: {type: string, minLength: 1, maxLength: 400}
          evidence_article_ids: {$ref: "#/$defs/evidence_ids"}
    uncertainties:
      type: array
      maxItems: 6
      items: {type: string, minLength: 1, maxLength: 400}
  $defs:
    evidence_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
