schema_version: 1
prompt_version: landscape-report-v1
kind: threat_landscape_report
language: sv
temperature: 0.1

system: |
  Du är en svenskspråkig strategisk cyberhotanalytiker. Analysera endast det
  strukturerade underlag som bifogas. Skilj observerade fakta från analytiska
  bedömningar och prognoshypoteser.

  Varje observation, förändring och prognoshypotes ska referera de kluster-ID:n
  som stöder den. Använd endast ID:n som finns i underlaget. Tolka inte fler
  artiklar eller större rapporteringsvolym som ökad hotaktivitet; de
  deterministiska händelsemåtten är primära och täckningsvarningar ska beaktas.

  Bevara osäkerheter, motstridiga uppgifter och alternativa förklaringar.
  Skapa inte attribueringar, MITRE ATT&CK-mappningar, händelser eller numeriska
  förändringar som saknas i underlaget. Om evidensen är otillräcklig ska detta
  anges som en datalucka i stället för att luckan fylls med antaganden.

  Prognoser är hypoteser, inte fakta. I denna version får confidence endast vara
  low eller medium. En hypotes ska ha indikatorer att bevaka och konkreta
  villkor som skulle tala emot den.

  Returnera endast ett JSON-objekt som följer det angivna schemat. Skriv inte
  Markdown, kodstaket eller kommentarer runt JSON-objektet.

user_template: |
  Skapa en långtidsanalys av hotlandskapet för den angivna profilen och den
  frysta analysperioden.

  ANALYSPROFIL:
  {profile_context}

  ANALYSPERIOD:
  {analysis_period}

  DETERMINISTISKA MÅTT OCH JÄMFÖRELSEPERIODER:
  {metrics}

  DATATÄCKNING OCH KVALITETSVARNINGAR:
  {coverage_warnings}

  VALIDERADE KLUSTERSNAPSHOTS:
  {cluster_snapshots}

  FÖREGÅENDE RAPPORT, OM DEN FINNS:
  {previous_report}

  Identifiera endast bestående mönster och förändringar som stöds av flera
  oberoende händelsekluster och mer än en tidsbucket. Redovisa alternativa
  förklaringar och dataluckor. Skapa därefter högst tre försiktiga
  prognoshypoteser för 30 eller 90 dagar. Utelämna prognoser om underlaget inte
  räcker. Returnera endast JSON enligt output_schema.

output_schema:
  type: object
  additionalProperties: false
  required:
    - schema_version
    - profile_id
    - period_start_ts
    - period_end_ts
    - executive_summary
    - observations
    - changes
    - alternative_explanations
    - data_gaps
    - forecast
  properties:
    schema_version:
      const: 1
    profile_id:
      type: string
      minLength: 1
    period_start_ts:
      type: integer
      minimum: 1
    period_end_ts:
      type: integer
      minimum: 1
    executive_summary:
      type: string
      minLength: 1
    observations:
      type: array
      items:
        $ref: "#/$defs/evidenced_assessment"
    changes:
      type: array
      items:
        $ref: "#/$defs/evidenced_change"
    alternative_explanations:
      type: array
      items:
        $ref: "#/$defs/evidenced_assessment"
    data_gaps:
      type: array
      items:
        type: string
        minLength: 1
    forecast:
      type: array
      maxItems: 3
      items:
        type: object
        additionalProperties: false
        required:
          - hypothesis
          - horizon_days
          - confidence
          - rationale
          - evidence_cluster_ids
          - leading_indicators
          - invalidation_conditions
        properties:
          hypothesis:
            type: string
            minLength: 1
          horizon_days:
            enum: [30, 90]
          confidence:
            enum: [low, medium]
          rationale:
            type: string
            minLength: 1
          evidence_cluster_ids:
            $ref: "#/$defs/evidence_ids"
          leading_indicators:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          invalidation_conditions:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
  $defs:
    evidence_ids:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
    evidenced_assessment:
      type: object
      additionalProperties: false
      required: [statement, confidence, evidence_cluster_ids]
      properties:
        statement:
          type: string
          minLength: 1
        confidence:
          enum: [low, medium, high]
        evidence_cluster_ids:
          $ref: "#/$defs/evidence_ids"
    evidenced_change:
      type: object
      additionalProperties: false
      required: [statement, direction, confidence, evidence_cluster_ids]
      properties:
        statement:
          type: string
          minLength: 1
        direction:
          enum: [increasing, decreasing, shifting, stable, uncertain]
        confidence:
          enum: [low, medium, high]
        evidence_cluster_ids:
          $ref: "#/$defs/evidence_ids"
