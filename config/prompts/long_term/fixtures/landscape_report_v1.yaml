prompt_version: landscape-report-v1
fixtures:
  - name: supported_multi_event_pattern
    input_characteristics:
      independent_clusters: 4
      time_buckets: 3
      coverage_warnings: []
    expectations:
      allow_change_assessment: true
      allow_forecast: true
      require_evidence_ids: true

  - name: sparse_evidence
    input_characteristics:
      independent_clusters: 1
      time_buckets: 1
      coverage_warnings: [insufficient_time_buckets]
    expectations:
      allow_change_assessment: false
      allow_forecast: false
      require_data_gap: true

  - name: duplicate_reporting_is_not_a_trend
    input_characteristics:
      independent_clusters: 1
      article_count: 12
      time_buckets: 1
      coverage_warnings: []
    expectations:
      allow_change_assessment: false
      allow_forecast: false
      forbidden_claim: increased_threat_activity_from_article_volume

  - name: conflicting_sources
    input_characteristics:
      independent_clusters: 2
      time_buckets: 2
      coverage_warnings: [conflicting_claims]
    expectations:
      require_alternative_explanation: true
      require_qualified_language: true

  - name: changed_source_mix
    input_characteristics:
      independent_clusters: 5
      time_buckets: 3
      coverage_warnings: [source_mix_shift]
    expectations:
      require_data_gap: true
      forbid_unqualified_direction: true
