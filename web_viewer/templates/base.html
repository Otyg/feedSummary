<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title or "FeedSummary Viewer" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 12px; }
    .sidebar { max-height: calc(100vh - 24px); overflow: auto; }
    .content { max-height: calc(100vh - 24px); overflow: auto; }
    .summary-html h1, .summary-html h2, .summary-html h3 { margin-top: 1.2rem; }
    .summary-html pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-light bg-light border-bottom mb-3">
    <div class="container-fluid px-2">
      <a class="navbar-brand" href="{{ url_for('list_articles') }}">FeedSummary</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('list_articles') }}">Artiklar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('manage_tags') }}">Taggar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('view_license') }}">Licens</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('view_source') }}">Source</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <div class="container-fluid">
    {% block body %}{% endblock %}
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
